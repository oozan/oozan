<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Ozan Özayrancı — full-stack systems engineer</title>
  <desc id="description">Animated green terminal interface showing Ozan's focus on product engineering, backend systems, and cloud delivery.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="18" x2="1110" y2="402" gradientUnits="userSpaceOnUse"><stop stop-color="#050806"/><stop offset="0.5" stop-color="#08130D"/><stop offset="1" stop-color="#061009"/></linearGradient>
    <linearGradient id="accent" x1="172" y1="90" x2="970" y2="318" gradientUnits="userSpaceOnUse"><stop stop-color="#86EFAC"/><stop offset="0.48" stop-color="#22C55E"/><stop offset="1" stop-color="#16A34A"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22C55E" stop-opacity="0"/><stop offset="0.5" stop-color="#22C55E" stop-opacity="0.16"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#22C55E" stroke-opacity="0.055"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame-clip"><rect x="1" y="1" width="1198" height="418" rx="22"/></clipPath>
  </defs>
  <style>
    .scanline { animation: scan 7s linear infinite; } .pulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .pulse-delayed { animation: pulse 2.8s 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .cursor { animation: blink 1.05s steps(1) infinite; } .signal-a { animation: signal 3.6s ease-in-out infinite; } .signal-b { animation: signal 3.6s 0.45s ease-in-out infinite; } .signal-c { animation: signal 3.6s 0.9s ease-in-out infinite; } .signal-d { animation: signal 3.6s 1.35s ease-in-out infinite; }
    @keyframes scan { from { transform: translateY(-70px); } to { transform: translateY(490px); } } @keyframes pulse { 0%, 100% { opacity: 0.45; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.08); } } @keyframes blink { 0%, 46% { opacity: 1; } 47%, 100% { opacity: 0; } } @keyframes signal { 0%, 100% { opacity: 0.2; } 45%, 65% { opacity: 0.95; } }
    @media (prefers-reduced-motion: reduce) { .scanline, .pulse, .pulse-delayed, .cursor, .signal-a, .signal-b, .signal-c, .signal-d { animation: none; } }
  </style>
  <g clip-path="url(#frame-clip)"><rect x="1" y="1" width="1198" height="418" rx="22" fill="url(#background)"/><rect x="1" y="1" width="1198" height="418" rx="22" fill="url(#grid)"/><ellipse cx="955" cy="202" rx="310" ry="240" fill="#16A34A" fill-opacity="0.045"/><rect class="scanline" x="0" y="0" width="1200" height="70" fill="url(#scan)"/></g>
  <rect x="1" y="1" width="1198" height="418" rx="22" stroke="#22C55E" stroke-opacity="0.42" stroke-width="2"/><path d="M1 58H1199" stroke="#22C55E" stroke-opacity="0.2"/>
  <circle cx="30" cy="30" r="5" fill="#166534"/><circle cx="50" cy="30" r="5" fill="#15803D"/><circle class="pulse" cx="70" cy="30" r="5" fill="#22C55E"/><text x="96" y="35" fill="#6B8F77" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" letter-spacing="1.5">OOZAN / ENGINEERING CONSOLE</text><text x="1167" y="35" fill="#22C55E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" text-anchor="end">ONLINE</text>
  <g transform="translate(68 105)"><text x="0" y="0" fill="#22C55E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">&gt; initialize profile</text><text x="0" y="71" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="55" font-weight="700" letter-spacing="-1.8">OZAN ÖZAYRANCI</text><text x="2" y="112" fill="#D1FAE5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19" letter-spacing="2.1">FULL-STACK SYSTEMS ENGINEER</text><text x="2" y="153" fill="#79A888" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">product interfaces · backend services · cloud delivery</text><rect class="cursor" x="587" y="137" width="9" height="21" rx="1" fill="#22C55E"/></g>
  <g transform="translate(69 309)"><rect width="292" height="68" rx="10" fill="#07130B" stroke="#22C55E" stroke-opacity="0.28"/><circle class="pulse" cx="25" cy="24" r="5" fill="#22C55E" filter="url(#glow)"/><text x="42" y="29" fill="#A7F3D0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">GO / SYSTEMS</text><rect class="signal-a" x="20" y="47" width="50" height="3" rx="1.5" fill="#22C55E"/><rect class="signal-b" x="78" y="47" width="79" height="3" rx="1.5" fill="#22C55E"/><rect class="signal-c" x="165" y="47" width="43" height="3" rx="1.5" fill="#22C55E"/><rect class="signal-d" x="216" y="47" width="55" height="3" rx="1.5" fill="#22C55E"/></g>
  <g transform="translate(385 309)"><rect width="292" height="68" rx="10" fill="#07130B" stroke="#22C55E" stroke-opacity="0.28"/><circle class="pulse-delayed" cx="25" cy="24" r="5" fill="#22C55E" filter="url(#glow)"/><text x="42" y="29" fill="#A7F3D0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">TS / PRODUCT</text><rect class="signal-b" x="20" y="47" width="70" height="3" rx="1.5" fill="#22C55E"/><rect class="signal-c" x="98" y="47" width="46" height="3" rx="1.5" fill="#22C55E"/><rect class="signal-d" x="152" y="47" width="92" height="3" rx="1.5" fill="#22C55E"/><rect class="signal-a" x="252" y="47" width="19" height="3" rx="1.5" fill="#22C55E"/></g>
  <g transform="translate(701 309)"><rect width="430" height="68" rx="10" fill="#07130B" stroke="#22C55E" stroke-opacity="0.28"/><circle class="pulse" cx="25" cy="24" r="5" fill="#22C55E" filter="url(#glow)"/><text x="42" y="29" fill="#A7F3D0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">CLOUD / DELIVERY</text><text x="408" y="29" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" text-anchor="end">BUILDING RELIABLE SYSTEMS</text><path d="M20 48H410" stroke="#22C55E" stroke-opacity="0.13" stroke-width="3" stroke-linecap="round"/><path class="signal-c" d="M20 48H330" stroke="#22C55E" stroke-width="3" stroke-linecap="round"/></g>
</svg>
